name: Release

on:
  push:
    tags: ["v*"]

# Only this workflow uses macOS runners, and only on a version tag: the darwin
# targets cannot be cross-compiled from Linux without the Apple SDK.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # The asset names are what `self-update` looks for:
      # <bin>-<target>.tar.gz and a matching .sha256.
      - name: Package
        run: |
          set -euo pipefail
          BIN=athena
          NAME="$BIN-${{ matrix.target }}"
          tar -czf "$NAME.tar.gz" -C "target/${{ matrix.target }}/release" "$BIN"
          if command -v sha256sum >/dev/null; then
            sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          else
            shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    # The only job that writes, and it runs no build code.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check every asset is here
        run: |
          set -euo pipefail
          for t in x86_64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin; do
            test -s "dist/athena-$t.tar.gz"
            test -s "dist/athena-$t.tar.gz.sha256"
          done

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run of an older tag must not move Latest back to it.
          current=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null) || echo "::warning::could not read the latest release, so this tag counts as the newest"
          newest=$(printf '%s\n%s\n' "$current" "$GITHUB_REF_NAME" | sort -V | tail -1)
          latest=false; [ "$newest" = "$GITHUB_REF_NAME" ] && latest=true
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$latest"
