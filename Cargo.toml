[package]
name = "athena-cli"
description = "Unofficial CLI that downloads a patient's or caregiver's own records from athenahealth practices through athenahealth's patient-access FHIR API."
version = "0.2.0"
edition = "2021"
# pk-cli-auth's refresh lock uses File::try_lock (1.89).
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/piekstra/athena-cli"
homepage = "https://github.com/piekstra/athena-cli"
authors = ["piekstra"]
publish = false

[lib]
name = "athena"
path = "src/lib.rs"

[[bin]]
name = "athena"
path = "src/main.rs"

[dependencies]
pk-cli-core = { git = "https://github.com/piekstra/cli-common", tag = "v0.31.0", features = ["reqwest"] }
pk-cli-secrets = { git = "https://github.com/piekstra/cli-common", tag = "v0.31.0" }
pk-cli-config = { git = "https://github.com/piekstra/cli-common", tag = "v0.31.0" }
pk-cli-selfupdate = { git = "https://github.com/piekstra/cli-common", tag = "v0.31.0" }
pk-cli-auth = { git = "https://github.com/piekstra/cli-common", tag = "v0.31.0" }
pk-cli-http = { git = "https://github.com/piekstra/cli-common", tag = "v0.31.0" }
pk-cli-documents = { git = "https://github.com/piekstra/cli-common", tag = "v0.31.0" }
# medical-common: the health-records/v1 stream and DTOs. Same cli-common tag.
pk-med-records = { git = "https://github.com/piekstra/medical-common", tag = "v0.1.0" }
pk-med-fhir = { git = "https://github.com/piekstra/medical-common", tag = "v0.1.0" }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
# preserve_order: DTO fields render in build order (SPEC v1 §1.4).
# raw_value: a resource is written to the stream as the server's own text,
# so no number or key is re-serialized on the way through.
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
# PKCE (S256) and the base64 of Binary resources; random state, nonce and
# verifier from the operating system's CSPRNG.
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
strip = true
lto = true
opt-level = "z"
